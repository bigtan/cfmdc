name: Reusable Build

on:
  workflow_call:
    inputs:
      artifact_prefix:
        description: Prefix used for uploaded artifact names.
        required: true
        type: string
      retention_days:
        description: Artifact retention period in days.
        required: false
        default: 7
        type: number

permissions:
  contents: read

jobs:
  build-linux:
    name: Debian 13 - Release
    runs-on: ubuntu-latest
    env:
      VCPKG_CACHE: ${{ github.workspace }}/.cache/vcpkg
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Restore Debian 13 vcpkg cache
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_CACHE }}
          key: debian13-x64-linux-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            debian13-x64-linux-vcpkg-

      - name: Build and test in Debian 13
        shell: bash
        run: |
          mkdir -p "$VCPKG_CACHE"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$VCPKG_CACHE:/vcpkg-cache" \
            -w /workspace \
            -e VCPKG_BINARY_SOURCES='clear;files,/vcpkg-cache,readwrite' \
            debian:13 bash -euo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates git build-essential pkg-config tar curl zip unzip \
                clang lld cmake ninja-build python3 autoconf automake libtool flex bison
              baseline=$(python3 -c "import json; print(json.load(open(\"vcpkg-configuration.json\"))[\"default-registry\"][\"baseline\"])")
              git init /opt/vcpkg
              git -C /opt/vcpkg remote add origin https://github.com/microsoft/vcpkg.git
              git -C /opt/vcpkg fetch --depth 1 origin "$baseline"
              git -C /opt/vcpkg checkout --detach FETCH_HEAD
              /opt/vcpkg/bootstrap-vcpkg.sh -disableMetrics
              cmake -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang \
                -DCMAKE_TOOLCHAIN_FILE=/opt/vcpkg/scripts/buildsystems/vcpkg.cmake \
                -DVCPKG_TARGET_TRIPLET=x64-linux
              cmake --build build --parallel 2
              ctest --test-dir build --output-on-failure
            '

      - name: Package Linux release
        shell: bash
        env:
          ARTIFACT_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          ref=$(printf '%s' "$ARTIFACT_REF" | sed 's/[^0-9A-Za-z._-]/-/g')
          test -n "$ref"
          mkdir -p dist
          tar -czf "dist/cfmdc-${ref}-x64-linux.tar.gz" -C build/bin .

      - name: Verify packaged binary in clean Debian 13
        shell: bash
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/dist:/dist:ro" \
            debian:13 bash -euo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends libstdc++6 libgcc-s1
              mkdir /app
              tar -xzf /dist/cfmdc-*-x64-linux.tar.gz -C /app
              cd /app
              ldd ./cfmdc | tee /tmp/ldd.txt
              if grep -q "not found" /tmp/ldd.txt; then
                exit 1
              fi
              ./cfmdc --version
              ./cfmdc --help
            '

      - name: Make container cache accessible to runner
        if: always()
        shell: bash
        run: sudo chown -R "$(id -u):$(id -g)" "$VCPKG_CACHE"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-x64-linux
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  build:
    name: ${{ matrix.os }} - Release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triplet: x64-windows-static
            vcpkg_cache_path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
            cmake_args: "-DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_C_COMPILER=clang-cl"

    env:
      BUILD_TYPE: Release
      VCPKG_BINARY_SOURCES: "clear;default,readwrite"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Ninja
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Create vcpkg cache directory
        shell: bash
        run: mkdir -p ${{ matrix.vcpkg_cache_path }}

      - name: Restore vcpkg cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ github.workspace }}/build/vcpkg_installed
            ${{ matrix.vcpkg_cache_path }}
          key: ${{ runner.os }}-${{ matrix.triplet }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.triplet }}-vcpkg-

      - name: Read vcpkg baseline
        id: vcpkg-baseline
        shell: pwsh
        run: |
          $config = Get-Content vcpkg-configuration.json | ConvertFrom-Json
          $baseline = $config.'default-registry'.baseline
          if (-not $baseline) {
            throw "Failed to read default-registry.baseline from vcpkg-configuration.json"
          }
          "commit=$baseline" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Pin vcpkg version
        shell: bash
        run: |
          cd "$VCPKG_INSTALLATION_ROOT"
          echo "Current vcpkg root: $VCPKG_INSTALLATION_ROOT"
          git reset --hard
          git fetch --all --quiet
          echo "Switching vcpkg to commit: ${{ steps.vcpkg-baseline.outputs.commit }}"
          git checkout ${{ steps.vcpkg-baseline.outputs.commit }}

          if [ "$RUNNER_OS" == "Windows" ]; then
            ./bootstrap-vcpkg.bat
          else
            ./bootstrap-vcpkg.sh
          fi

      - name: Configure CMake
        shell: pwsh
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Test
        working-directory: build
        run: ctest -C ${{ env.BUILD_TYPE }} --output-on-failure

      - name: Compute artifact ref
        id: artifact-ref
        shell: pwsh
        run: |
          $ref = if ($env:GITHUB_HEAD_REF) {
            $env:GITHUB_HEAD_REF
          } else {
            $env:GITHUB_REF_NAME
          }
          $sanitized = $ref -replace '[^0-9A-Za-z._-]', '-'
          if (-not $sanitized) {
            throw "Failed to derive a sanitized artifact ref from '$ref'"
          }
          "value=$sanitized" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/bin/* -DestinationPath dist/cfmdc-${{ steps.artifact-ref.outputs.value }}-${{ matrix.triplet }}.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-${{ matrix.triplet }}
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
